# Mosquitto config for offline garage
# Pi4 Server 10.0.0.1 + 192.168.4.1

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/

# Для ESPHome и Pi5
# user garage / password garage2026

# Логи
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true

# LWT для детекта падения Pi5
# Pi5 при подключении публикует will

# Offline - без TLS для простоты, в гараже можно
# Для диплома можно добавить TLS

# Разрешить локальные подключения
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
