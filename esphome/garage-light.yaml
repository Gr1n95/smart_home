# ESPHome - Узел Свет + Ворота + Безопасность
# Плата: ESP32 DevKit V1 (второй)
# Датчики: BH1750 (lux), геркон на ворота, PIR как fallback радара
# Исполнители: 2 реле (свет, вытяжка) - пока на ESP, потом перенесем на Pi4
# MQTT: Pi4 10.0.0.1

esphome:
  name: garage-light
  friendly_name: Garage Light
  platform: ESP32
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.4.21
    gateway: 192.168.4.1
    subnet: 255.255.255.0
    dns1: 192.168.4.1
  ap:
    ssid: "Garage-Light Fallback"
    password: "garage1234"

captive_portal:
logger:
api:
  encryption:
    key: "your_api_key_2"
ota:
  password: "ota_password_garage2"

mqtt:
  broker: 10.0.0.1
  port: 1883
  username: garage
  password: garage2026
  discovery: false
  topic_prefix: garage/light
  id: mqtt_client

i2c:
  sda: 21
  scl: 22
  scan: true

sensor:
  - platform: bh1750
    name: "Garage Illuminance"
    id: garage_lux
    address: 0x23
    update_interval: 5s
    state_topic: garage/light/lux
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 2
    on_value:
      then:
        - lambda: |-
            // Автосвет: если темно <50 lux и есть человек (радар) -> включить свет
            // Логика будет на Pi4, но можно и тут как fallback
            if (id(garage_lux).state < 50) {
              // publish для Pi4
            }

  - platform: wifi_signal
    name: "Garage Light WiFi"
    update_interval: 30s

binary_sensor:
  # Геркон на ворота гаража - открыто/закрыто
  - platform: gpio
    pin:
      number: 16
      mode: INPUT_PULLUP
    name: "Garage Gate"
    id: garage_gate
    device_class: garage_door
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_state:
      then:
        - mqtt.publish:
            topic: garage/gate/state
            payload: !lambda 'return id(garage_gate).state ? "OPEN" : "CLOSED";'
        - if:
            condition:
              binary_sensor.is_on: garage_gate
            then:
              - mqtt.publish:
                  topic: garage/alarm
                  payload: '{"type":"GATE_OPEN","duration":0}'

  # PIR датчик как fallback пока нет LD2450
  - platform: gpio
    pin: 17
    name: "Garage PIR Motion"
    id: garage_pir
    device_class: motion
    on_press:
      then:
        - mqtt.publish:
            topic: garage/security/motion
            payload: "ON"
        - mqtt.publish:
            topic: garage/security/radar/count
            payload: "1"
    on_release:
      then:
        - mqtt.publish:
            topic: garage/security/motion
            payload: "OFF"
            # Не сразу в 0, а через 5 мин на Pi4

switch:
  # Реле света 10A
  - platform: gpio
    pin: 18
    name: "Garage Light Relay"
    id: light_relay
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - mqtt.publish:
          topic: garage/actuator/light/state
          payload: "ON"
    on_turn_off:
      - mqtt.publish:
          topic: garage/actuator/light/state
          payload: "OFF"

  # Реле вытяжки
  - platform: gpio
    pin: 19
    name: "Garage Fan Relay"
    id: fan_relay
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - mqtt.publish:
          topic: garage/actuator/fan/state
          payload: "ON"
    on_turn_off:
      - mqtt.publish:
          topic: garage/actuator/fan/state
          payload: "OFF"

# Управление по MQTT с Pi4 (Astra)
# Pi4 публикует garage/actuator/light -> ON/OFF
mqtt:
  on_message:
    - topic: garage/actuator/light
      payload: "ON"
      then:
        - switch.turn_on: light_relay
    - topic: garage/actuator/light
      payload: "OFF"
      then:
        - switch.turn_off: light_relay
    - topic: garage/actuator/fan
      payload: "ON"
      then:
        - switch.turn_on: fan_relay
    - topic: garage/actuator/fan
      payload: "OFF"
      then:
        - switch.turn_off: fan_relay
